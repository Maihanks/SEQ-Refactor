# The generated synthetic-corpus ablation matrix (Working Brief, Phase 2, Section 2/3).
# Corpus: datasets/synthetic/*/ (CORPUS.md documents every subject's spec parameters;
# regenerate the whole corpus with `uv run python -c "from seqrefactor.synth.build_corpus
# import build_corpus, write_corpus_md; build_corpus(); write_corpus_md()"`).
#
# WARNING (matches configs/opensource.yaml / configs/ablation.yaml): the orchestrator
# mutates its target module in place. NEVER point subjects_glob at datasets/synthetic/
# directly for a real run -- copy the corpus to a scratch location first.
subjects_glob: "datasets/synthetic/*/"
# 8 arms (Working Brief Phase 2c §3 adds random/random_topological to Phase 2's five;
# Working Brief Phase 4 / E3 adds ouni_nsga2, a real NSGA-II multi-objective search
# informed by -- not a faithful reproduction of -- Ouni et al. [29]'s described
# maximise-correction/minimise-effort structure, see order/nsga2_scheduler.py):
strategies: ["seqrefactor", "impact_only", "topo_only", "unordered", "search_based", "random", "random_topological", "ouni_nsga2"]
generators: ["baseline"]
impact_weights:
  alpha: 0.4
  beta: 0.4
  gamma: 0.2
discount: 0.9
coverage_min: 0.0
seed: 20260101
# Corpus subjects carry 2-31 planted smells each (see CORPUS.md); 10 steps covers the
# small/medium tiers and every conflict subject fully (conflict subjects have 2-7
# smells and terminate long before the cap regardless), and a meaningful portion of
# the large/xlarge tiers, while keeping total run cost bounded -- see
# PHASE2_PLAN.md's cost/scope note.
max_steps: 10
