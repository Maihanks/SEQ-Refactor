# The generated synthetic-corpus ablation matrix (Working Brief, Phase 2, Section 2/3).
# Corpus: datasets/synthetic/*/ (CORPUS.md documents every subject's spec parameters;
# regenerate the whole corpus with `uv run python -c "from seqrefactor.synth.build_corpus
# import build_corpus, write_corpus_md; build_corpus(); write_corpus_md()"`).
#
# WARNING (matches configs/opensource.yaml / configs/ablation.yaml): the orchestrator
# mutates its target module in place. NEVER point subjects_glob at datasets/synthetic/
# directly for a real run -- copy the corpus to a scratch location first.
subjects_glob: "datasets/synthetic/*/"
strategies: ["seqrefactor", "impact_only", "topo_only", "unordered", "search_based"]
generators: ["baseline"]
impact_weights:
  alpha: 0.4
  beta: 0.4
  gamma: 0.2
discount: 0.9
coverage_min: 0.0
seed: 20260101
# Corpus subjects carry 8-31 planted smells each (see CORPUS.md); 10 steps covers the
# small/medium tiers fully and a meaningful portion of the large/xlarge tiers, while
# keeping total run cost bounded (~16 real-source subjects x 5 strategies x 10 steps x
# ~2.5s/step, measured against a generated small subject, is on the order of 30
# minutes -- see PHASE2_PLAN.md's cost/scope note).
max_steps: 10
