plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

repositories {
    mavenCentral()
}

dependencies {
    // `implementation`, not `testImplementation`: this sidecar's job is to compile and run
    // OTHER modules' JUnit tests, so the Jupiter API/engine must be bundled into the shadow
    // jar and present on java.class.path at runtime, not just available for this project's
    // own unit tests.
    implementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    implementation 'org.junit.platform:junit-platform-launcher:1.10.2'
    implementation 'com.github.mauricioaniche:ck:0.6.4'
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'org.seqrefactor.sidecar.SidecarCli'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

test {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier.set('all')
}
