plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

repositories {
    mavenCentral()
}

dependencies {
    // `implementation`, not `testImplementation`: this sidecar's job is to compile and run
    // OTHER modules' JUnit tests, so the Jupiter API/engine must be bundled into the shadow
    // jar and present on java.class.path at runtime, not just available for this project's
    // own unit tests.
    implementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    implementation 'org.junit.platform:junit-platform-launcher:1.10.2'
    // JUnit 4 (vintage) support: real open-source subjects (e.g. datasets/opensource/) commonly
    // still use JUnit 4-style `org.junit.Test` tests, not just Jupiter. The vintage engine lets
    // the same JUnit Platform Launcher in TestRunnerCommand run both without any subject-side
    // detection of which JUnit version is in use.
    implementation 'junit:junit:4.13.2'
    implementation 'org.junit.vintage:junit-vintage-engine:5.10.2'
    implementation 'com.github.mauricioaniche:ck:0.6.4'
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'org.seqrefactor.sidecar.SidecarCli'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

test {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier.set('all')
    // Without this, Shadow keeps only one jar's copy of each
    // META-INF/services/org.junit.platform.engine.TestEngine file (jupiter's or vintage's,
    // whichever is processed last) instead of merging them -- silently disabling one JUnit
    // engine's test discovery entirely. Both engines must be registered for the sidecar to
    // run JUnit 4 and JUnit 5 subject test suites side by side.
    mergeServiceFiles()
}
