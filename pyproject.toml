[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqrefactor"
version = "0.1.0"
description = "SEQ-REFACTOR: a stateful agentic pipeline for impact-forward, dependency-safe ordering of multi-smell refactorings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Munura Maihankali" }]
keywords = [
    "refactoring",
    "code-smells",
    "topological-sort",
    "agentic-ai",
    "software-maintainability",
]

dependencies = [
    "pydantic>=2.6",
    "click>=8.1",
    "networkx>=3.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-java>=0.21,<0.22",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openai>=1.40",
    "GitPython>=3.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "jinja2>=3.1",
    "matplotlib>=3.11.1",
]

[project.scripts]
seqrefactor = "seqrefactor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.165.10",
]

[tool.setuptools.packages.find]
include = ["seqrefactor*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
